
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>فمن یمت پلیر</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090909;color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center;
}
main{width:100%;max-width:520px;padding:28px 20px}
header{text-align:center;margin:35px 0}
.logo{
  width:85px;height:85px;border:2px solid #e32636;
  border-radius:50%;display:grid;place-items:center;
  margin:auto;color:#e32636;font-size:32px;
  box-shadow:0 0 25px #e3263650;
}
h1{color:#f04452;font-size:27px;margin:18px 0 8px}
.sub{color:#999;font-size:13px}
.panel{
  background:#151515;border:1px solid #292929;
  border-radius:18px;padding:20px;margin-top:22px;
}
h2{font-size:17px;margin:0 0 16px}
button,.choose{
  display:block;width:100%;padding:15px;border:0;
  border-radius:12px;background:#d92336;color:white;
  font-size:15px;font-weight:bold;text-align:center;
  cursor:pointer;margin-top:12px;
}
input{display:none}
audio{width:100%;margin-top:18px}
#filename{color:#bbb;font-size:13px;margin-top:15px;overflow-wrap:anywhere}
.note{color:#888;font-size:12px;line-height:2;text-align:center;margin-top:25px}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">♪</div>
  <h1>فمن یمت پلیر</h1>
  <div class="sub">پایگاه پخش صوت‌های مذهبی</div>
</header>

<section class="panel">
  <h2>پخش صوت</h2>
  <div id="filename">هنوز فایلی انتخاب نشده است</div>
  <audio id="player" controls></audio>
  <label class="choose" for="audioFile">انتخاب آهنگ از گوشی</label>
  <input id="audioFile" type="file" accept="audio/*">
</section>

<p class="note">
  فمن یمت یرنی<br>
  نسخه آزمایشی پلیر
</p>
</main>

<script>
const input = document.getElementById('audioFile');
const player = document.getElementById('player');
const filename = document.getElementById('filename');
let currentUrl = null;

input.addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(file);
  player.src = currentUrl;
  filename.textContent = file.name;
  player.play().catch(()=>{});
});
</script>
</body>
</html>
