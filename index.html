
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فمن یمت پلیر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:25px 12px;background:#160707;border-bottom:2px solid #c00}
h1{color:#f22;margin:0 0 8px;font-size:26px}
header p{color:#bbb;margin:0}
main{max-width:650px;margin:20px auto;padding:15px}
.panel{background:#171717;border:1px solid #333;border-radius:15px;padding:18px;margin-bottom:18px}
h2{font-size:18px;color:#f44;margin-top:0}
input,button{font:inherit;border-radius:9px;padding:12px;width:100%;margin:6px 0}
input{background:#090909;color:white;border:1px solid #555}
button{background:#b90000;color:white;border:0;cursor:pointer}
button:active{opacity:.7}
button.secondary{background:#333}
#trackList{max-height:330px;overflow:auto}
.track{padding:13px;border-bottom:1px solid #333;cursor:pointer}
.track:hover,.track.active{background:#351010;color:#ff7777}
audio{width:100%;margin-top:12px}
.controls{display:flex;gap:8px}
.controls button{flex:1}
.small{color:#aaa;font-size:13px;line-height:1.8}
#status{color:#ff7777;white-space:pre-wrap;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>فمن یمت پلیر</h1>
<p>پخش صوت و آثار مذهبی</p>
</header>
<main>
<section class="panel">
<h2>جست‌وجوی فایل صوتی</h2>
<input id="search" placeholder="نام فایل را جست‌وجو کن...">
<div id="trackList">در حال دریافت فایل‌ها...</div>
</section>
<section class="panel">
<h2>پخش‌کننده</h2>
<div id="nowPlaying">هنوز فایلی انتخاب نشده است</div>
<audio id="player" controls preload="metadata"></audio>
<div class="controls">
<button class="secondary" id="previous">قبلی</button>
<button class="secondary" id="next">بعدی</button>
</div>
</section>
<section class="panel">
<button id="adminToggle">ورود به پنل مدیریت</button>
<div id="adminPanel" class="hidden">
<h2>پنل مدیریت و آپلود صوت</h2>
<p class="small">رمز مدیریت و فایل صوتی را وارد کن.</p>
<input id="adminPassword" type="password" autocomplete="current-password" maxlength="64" placeholder="رمز مدیریت">
<input id="audioFile" type="file" accept=".mp3,.wav,.ogg,.m4a,.aac,.flac,audio/*">
<button id="uploadButton">آپلود فایل صوتی</button>
<p id="status"></p>
</div>
</section>
</main>
<script>
const PROJECT_URL='https://aynttkwsjcsqekozpqhu.supabase.co';
const PUBLIC_KEY='sb_publishable_qztglrbcRsrzczgTZA9F_Q_jxeUszFe';
const BUCKET='famanyamot';
const FUNCTION_URL=PROJECT_URL+'/functions/v1/admin-upload';
const db=window.supabase.createClient(PROJECT_URL,PUBLIC_KEY);
const player=document.getElementById('player');
const list=document.getElementById('trackList');
let tracks=[];
let currentIndex=-1;

function showName(name){
 return name.replace(/^\d+-/,'').replace(/%20/g,' ');
}

async function loadTracks(){
 list.textContent='در حال دریافت فایل‌ها...';
 const {data,error}=await db.storage.from(BUCKET).list('',{
  limit:200,sortBy:{column:'name',order:'asc'}
 });
 if(error){list.textContent='خطا در دریافت فایل‌ها: '+error.message;return;}
 tracks=(data||[]).filter(file=>/\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(file.name));
 renderTracks();
}

function renderTracks(){
 const query=document.getElementById('search').value.trim().toLowerCase();
 const filtered=tracks.map((file,index)=>({file,index}))
  .filter(item=>showName(item.file.name).toLowerCase().includes(query));
 list.innerHTML='';
 if(!filtered.length){list.textContent='فایلی پیدا نشد.';return;}
 filtered.forEach(item=>{
  const div=document.createElement('div');
  div.className='track'+(currentIndex===item.index?' active':'');
  div.textContent=showName(item.file.name);
  div.onclick=()=>playTrack(item.index);
  list.appendChild(div);
 });
}

function playTrack(index){
 if(index<0||index>=tracks.length)return;
 currentIndex=index;
 const file=tracks[index];
 const {data}=db.storage.from(BUCKET).getPublicUrl(file.name);
 player.src=data.publicUrl;
 document.getElementById('nowPlaying').textContent=showName(file.name);
 player.play().catch(()=>{});
 renderTracks();
}

document.getElementById('search').addEventListener('input',renderTracks);
document.getElementById('previous').onclick=()=>playTrack(currentIndex-1);
document.getElementById('next').onclick=()=>playTrack(currentIndex+1);
player.addEventListener('ended',()=>playTrack(currentIndex+1));

document.getElementById('adminToggle').onclick=()=>{
 document.getElementById('adminPanel').classList.toggle('hidden');
};

document.getElementById('uploadButton').onclick=async()=>{
 const password=document.getElementById('adminPassword').value;
 const file=document.getElementById('audioFile').files[0];
 const status=document.getElementById('status');
 const button=document.getElementById('uploadButton');

 if(password.length<8||password.length>64){
  status.textContent='رمز باید بین ۸ تا ۶۴ نویسه باشد.';
  return;
 }
 if(!file){status.textContent='اول فایل صوتی را انتخاب کن.';return;}
 if(file.size>50*1024*1024){
  status.textContent='حجم فایل نباید بیشتر از ۵۰ مگابایت باشد.';
  return;
 }

 button.disabled=true;
 status.textContent='در حال آپلود...';
 try{
  const form=new FormData();
  form.append('password',password);
  form.append('file',file);
  const response=await fetch(FUNCTION_URL,{
   method:'POST',
   headers:{'apikey':PUBLIC_KEY},
   body:form
  });
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'آپلود انجام نشد.');
  status.textContent='فایل با موفقیت آپلود شد.';
  document.getElementById('audioFile').value='';
  document.getElementById('adminPassword').value='';
  await loadTracks();
 }catch(error){
  status.textContent='خطا: '+error.message;
 }finally{
  button.disabled=false;
 }
};
loadTracks();
</script>
</body>
</html>
